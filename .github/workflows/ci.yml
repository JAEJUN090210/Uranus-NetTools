name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Smoke test
        run: node dist/unt.cjs --version

  # 브랜치 보호 규칙에는 매트릭스 작업 9개 대신 이 작업 하나만 필수 검사로 등록합니다.
  ci:
    name: CI
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        run: test "${{ needs.check.result }}" = "success"
